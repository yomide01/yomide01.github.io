<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AAY — YouTube Shorts OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      max-width: 560px;
      width: 100%;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    }
    h1 { margin-top: 0; font-size: 1.4rem; color: #ff4e45; }
    code {
      display: block;
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      word-break: break-all;
      color: #79c0ff;
      margin: 14px 0;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    .links { margin-top: 22px; font-size: 0.85rem; color: #8b949e; }
    .links a { color: #58a6ff; text-decoration: none; margin-right: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">AAY — Autonomous YouTube Shorts Engine</h1>
    <div id="content">
      <p>Official OAuth 2.0 Redirect Portal for connecting your YouTube Channel to your Telegram Co-Pilot (<code>@AATTK01_bot</code>).</p>
    </div>
    <div class="links">
      <a href="/terms.html">Terms of Service</a>
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </div>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      const content = document.getElementById("content");
      const heading = document.getElementById("heading");

      if (error) {
        heading.textContent = "Authorization Cancelled";
        content.innerHTML = "<p>Error returned: <strong>" + error + "</strong></p>";
        return;
      }

      if (code) {
        const cmd = "/youtube " + code;
        heading.textContent = "✅ YouTube Channel Code Ready!";
        content.innerHTML =
          "<p>Copy the command below and send it to your Telegram bot (<strong>@AATTK01_bot</strong>) to finish linking your YouTube channel:</p>" +
          "<code id='cmdBox'></code>" +
          "<button id='copyBtn'>Copy Command</button>";
        document.getElementById("cmdBox").textContent = cmd;
        document.getElementById("copyBtn").onclick = function() {
          navigator.clipboard.writeText(cmd);
          this.textContent = "Copied! Paste in Telegram";
        };
      }
    })();
  </script>
</body>
</html>
