<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests;" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>AAT Studio</title>
  <link rel="icon" type="image/png" href="/aat_app_icon.png" />
  <link rel="stylesheet" href="/callback/relay.css" />
</head>
<body data-ready="false">
  <main class="gateway-panel">
    <div class="panel-section">
      <h1>Session Token Ready</h1>
      <p class="desc">
        Copy the command below to complete your session handshake:
      </p>
    </div>

    <div class="panel-section">
      <div class="cmd-label">Session Command</div>
      <code class="cmd-box" id="cmdBox"></code>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="copyCmdBtn">Copy Command</button>
        <button type="button" class="btn btn-ghost" id="copyRawBtn">Copy Raw Code</button>
      </div>
    </div>
  </main>

  <script src="/callback/relay.js"></script>
</body>
</html>
